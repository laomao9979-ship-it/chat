<!doctype html>
<html lang="zh-CN"><head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.lhr.life https://*.localhost.run https://api.github.com; base-uri 'none'; form-action 'none'"><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)"><title>朋友聊天</title><link rel="stylesheet" href="./style.css?v=41c793fc"><link rel="modulepreload" href="./usage-view.js?v=41c793fc"><link rel="modulepreload" href="./markdown.js?v=41c793fc"><script type="module" src="./app.js?v=41c793fc"></script></head>
<body>
<div id="booting" class="entry"><div class="booting"><span class="logo" aria-hidden="true">✳</span><p id="boot-message" role="status">正在打开聊天…</p><p class="muted">不用刷新，接上会自动进入。</p><div class="typing"><i></i><i></i><i></i></div></div></div>
<section id="login-screen" class="entry" hidden>
  <div class="entry-card"><span class="logo" aria-hidden="true">✳</span><h1>朋友聊天</h1><p class="muted">一个安静的地方，把问题聊明白。</p>
    <form id="login-form" novalidate><label for="access-code">访问口令</label><input id="access-code" type="password" autocomplete="current-password" required placeholder="输入朋友发给你的口令"><p id="login-error" class="error" role="alert"></p><button class="primary wide" type="submit">进入聊天</button></form>
  </div>
</section>
<div id="chat-screen" class="layout" hidden>
  <aside id="sidebar">
    <div class="aside-top"><span class="brand"><span class="logo-sm" aria-hidden="true">✳</span>朋友聊天</span><button id="close-menu" class="icon-button mobile-only" type="button" aria-label="收起对话列表"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <button id="new-chat" class="new-chat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新对话</button>
    <p class="list-label">最近对话</p>
    <nav id="conversation-list" aria-label="最近对话"></nav>
    <div class="aside-bottom"><section id="account-usage" class="account-usage" aria-label="额度状态"><p>正在读取额度…</p></section><button id="logout" class="text-button" type="button">退出聊天</button></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <main class="chat-main">
    <header class="topbar">
      <button id="menu" class="icon-button mobile-only" type="button" aria-label="打开对话列表" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="topbar-text"><h1 id="conversation-title">新对话</h1><p id="availability" class="muted">正在读取聊天状态…</p></div>
      <button id="new-chat-mobile" class="icon-button mobile-only" type="button" aria-label="新对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </header>
    <section id="messages" class="messages" aria-label="对话记录" aria-live="polite"><div id="thread" class="thread"></div></section>
    <button id="to-bottom" class="to-bottom" type="button" aria-label="回到最新消息" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
    <div class="composer-wrap">
      <div id="request-error" class="error" role="alert"></div>
      <form id="chat-form" class="composer">
        <label class="sr-only" for="message-input">发送消息</label>
        <textarea id="message-input" rows="1" placeholder="输入你想聊的内容…" enterkeyhint="send"></textarea>
        <div class="composer-bottom">
          <div class="chat-options">
            <label class="select-pill"><span class="sr-only">模型</span><select id="model-select" aria-label="模型"></select></label>
            <label class="select-pill"><span class="sr-only">思考强度</span><select id="effort-select" aria-label="思考强度"></select></label>
          </div>
          <button id="send" type="submit" class="round-button" aria-label="发送消息" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
          <button id="stop" type="button" class="round-button stop" aria-label="停止回答" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
        </div>
      </form>
      <p id="input-hint" class="hint">Enter 发送，Shift + Enter 换行</p>
    </div>
  </main>
</div>
</body></html>
