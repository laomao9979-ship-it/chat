<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>聊天</title>
<style>
:root{--ink:#1d1d1f;--page:#fff}
@media(prefers-color-scheme:dark){:root{--ink:#ececf1;--page:#16161a}}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:0 16px;background:var(--page);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;text-align:center}
</style>
</head>
<body>
<p id="m">正在打开聊天…</p>
<script>
// 固定门牌：url.txt 里是当前聊天地址，由主人电脑上的服务在地址变化时自动更新。
fetch('url.txt?t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(u => {
  u = u.trim();
  if (!u) return document.getElementById('m').textContent = '聊天暂时没开，过一会儿再来。';
  if (!/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(u)) throw 0;
  location.replace(u);
}).catch(() => { document.getElementById('m').textContent = '暂时打不开，请过一分钟刷新重试。'; });
</script>
</body>
</html>
